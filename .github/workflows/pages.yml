name: Publicar Ergonomic Analyzer en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Ergonomic Analyzer
        uses: actions/checkout@v5

      - name: Comprobar programas incorporados
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path(".")
          required = [
              "index.html", "js/app.js",
              "ocra/index.html", "posturas/index.html", "empuje-traccion/index.html",
              "mmc/index.html", "mmc/variable/index.html",
              "mmc/compuesta/index.html", "mmc/secuencial/index.html",
              "mmc/docs/instrucciones-mmc.pdf"
          ]
          for name in required:
              assert (root / name).is_file(), f"Falta archivo publicado: {name}"
          print("Programas incorporados: estructura basica correcta")
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
