name: Pruebas funcionales MMC (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-mmc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar pruebas del portal
        uses: actions/checkout@v4
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright
        run: |
          npm install --no-save @playwright/test@1.58.2
          npx playwright install --with-deps chromium
      - name: Ejecutar pruebas sobre GitHub Pages publicado
        env:
          MMC_BASE_URL: https://clopez-spmas.github.io/Ergonomic-analyzer/
          CI: 'true'
        run: npx playwright test -c playwright.mmc.config.cjs
      - name: Guardar informe y capturas, incluso si hay errores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-playwright-mmc
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
