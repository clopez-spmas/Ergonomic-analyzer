<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ergonomic Analyzer</title>
<link rel="stylesheet" href="css/styles.css?v=20261113-selector-directo">
</head>
<body>
<main class="container">

<section id="methodScreen" class="access-screen card method-screen">
  <div class="access-hero">
    <span class="access-badge">Selección del método</span>
    <h1>¿Qué programa desea utilizar?</h1>
    <p>Seleccione el programa de evaluación ergonómica que desea utilizar.</p>
  </div>

  <div class="access-content">
    <h2>Seleccione el programa</h2>
    <p class="access-intro">Cada programa dispone de su propio flujo de trabajo y sus propios estudios.</p>

    <div class="method-actions">
      <button type="button" class="method-button" data-method="ocra">Abrir Ocra&nbsp; →</button>
      <button type="button" class="method-button" data-method="posturas">Abrir Posturas Forzadas&nbsp; →</button>
      <button type="button" class="method-button" data-method="empuje-traccion">Abrir Empuje y Tracción&nbsp; →</button>
      <button type="button" class="method-button" data-method="mmc">Abrir MMC&nbsp; →</button>
    </div>


  </div>
</section>

</main>

<script src="js/app.js"></script>
</body>
</html>
